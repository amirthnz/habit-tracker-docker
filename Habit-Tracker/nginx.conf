server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Badge vision uploads are sent as JSON; leave headroom.
    client_max_body_size 15m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The Vite build emits hashed filenames under /assets/ — cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy the API to the Django/Gunicorn container (service name: api).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Gemini badge/coaching calls can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Django admin + whitenoise-served admin static files.
    location /admin {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://api:8000;
        expires 1y;
        add_header Cache-Control "public";
    }

    # index.html must never be cached, so deploys go live immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: every unknown route serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
